# =============================================================================
# Spidy — Master Configuration File
# Edit this file to customise your Spidy instance.
# All values can be overridden by environment variables prefixed with SPIDY_.
# =============================================================================

# --------------------------------------------------------------------------- #
# Application                                                                 #
# --------------------------------------------------------------------------- #
app:
  name: "Spidy"
  version: "0.1.0"
  user_name: "Shiva"             # Your name — used in greetings
  debug: false                   # Set true for verbose output during dev
  log_level: "INFO"              # DEBUG | INFO | WARNING | ERROR | CRITICAL

# --------------------------------------------------------------------------- #
# Paths                                                                       #
# --------------------------------------------------------------------------- #
paths:
  data_dir: "%APPDATA%/Spidy"          # Persistent user data
  log_dir: "%APPDATA%/Spidy/logs"      # Log files
  memory_dir: "%APPDATA%/Spidy/memory" # SQLite + ChromaDB storage
  models_dir: "assets/models"          # AI model files
  plugins_dir: "plugins"               # Plugin discovery root

# --------------------------------------------------------------------------- #
# Logging                                                                     #
# --------------------------------------------------------------------------- #
logging:
  level: "INFO"                   # Global log level
  rotation: "10 MB"               # Rotate when file reaches this size
  retention: "30 days"            # Keep logs for this many days
  format: "{time:YYYY-MM-DD HH:mm:ss.SSS} | {level:<8} | {name}:{line} | {message}"
  colorize: true                  # Coloured console output
  backtrace: true                 # Full tracebacks on errors
  diagnose: true                  # Variable values in tracebacks (dev only)

# --------------------------------------------------------------------------- #
# Voice Engine                                                                #
# --------------------------------------------------------------------------- #
voice:
  # Wake Word
  wake_word:
    enabled: true
    model: "hey_jarvis"           # Model name. See _MODEL_MAP in openwakeword.py for valid values.
                                  # Proven: hey_jarvis_v0.1 scored 0.4473 (diagnostics) and
                                  # 0.3073 (production). Community models (jarvis_v1/v2) are
                                  # 200KB heads only — NOT clearly better. Do not switch.
    threshold: 0.35               # Detection confidence threshold (0.0-1.0).
                                  # Production scored 0.3073 with threshold=0.4 — was 0.07 short.
                                  # Lowered to 0.35: clear "Hey Jarvis" at normal volume will fire.
                                  # Raise to 0.45 if false positives occur in your environment.
    chunk_size: 1280              # Audio frames per chunk (16kHz, 80ms)
    custom_model_path: null       # Path to a custom .onnx wake word model file.
                                  # Set this to use a trained "Hey Spidy" model when ready.
                                  # Example: "assets/models/wake_word/hey_spidy.onnx"
                                  # When set, bypasses model: field and _MODEL_MAP entirely.
                                  # score_key will be the model filename stem (e.g. "hey_spidy").


  # Speech Recognition
  stt:
    model: "base.en"              # tiny.en | base.en | small.en | medium.en
    device: "auto"                # auto | cpu | cuda
    compute_type: "int8"          # int8 (CPU) | float16 (GPU)
    language: "en"
    vad_filter: true              # Voice Activity Detection to skip silence
    vad_threshold: 0.5

  # Text-to-Speech
  tts:
    engine: "piper"               # piper | kokoro | system
    voice: "en_US-ryan-high"      # Piper male voice model
    speed: 1.0                    # Playback speed multiplier
    volume: 1.0                   # Output volume (0.0–1.0)

  # Audio Device
  audio:
    input_device: null            # null = system default
    output_device: null           # null = system default
    sample_rate: 16000
    channels: 1
    mic_gain: 8.0                 # Software microphone amplification (applied before OWW/STT).
                                  # Increase if wake word is never detected. Decrease if audio clips.
                                  # Diagnostic: run diag_audio_deep.py — if peak_i16 < 2000 while
                                  # speaking, raise this value. Typical range: 1.0 (already loud)
                                  # to 16.0 (very quiet mic). Set to 1.0 to disable.

  # Continuous Conversation Session
  # ----------------------------------
  session:
    continuous_mode: true             # Stay listening between turns (no repeat wake word needed).
    conversation_timeout_seconds: 60  # Close session after N seconds of inactivity.
    max_turns_per_session: 50
    measure_latency: true             # Log voice pipeline timing (first-word, STT, Brain, TTS).

    # Post-ack audio buffer flush (prevents ack-echo contamination of STT).
    # After "Yes Shiva." plays, the capture buffer is cleared for this many
    # milliseconds before mic is opened for the user's command.
    # Set to 0 to disable (headphone setups have negligible echo).
    post_ack_flush_ms: 100

    # Transcript deduplication window (prevents stale audio re-processed as new command).
    # If the same transcript arrives again within this interval (seconds), it is
    # silently dropped. Two separate identical commands separated by more than this
    # interval are both processed normally.
    # Set to 0.0 to disable.
    transcript_dedup_window_seconds: 1.5

  # Barge-in Interruption Detector
  # --------------------------------
  # While Spidy is speaking (TTS), a lightweight separate STT path stays active
  # so the user can say "Spidy stop" and immediately halt speech.
  # Uses a dedicated tiny.en model (separate from the main base.en STT) to avoid
  # model contention.  Measured latency: ~1.4 s worst case (0.8 s accumulate +
  # 671 ms tiny.en inference).
  barge_in:
    enabled: true                 # Master switch. Set false to revert to IDLE (mic muted during TTS).
    model: "tiny.en"              # faster-whisper model for barge-in STT.
                                  # tiny.en: 671 ms warm / ~180 MB.  base.en: 899 ms / 354 MB.
                                  # Do NOT change to base.en — that model is busy with main STT.
    window_seconds: 0.8           # Audio window length (seconds) accumulated before running STT.
                                  # Range: 0.4–2.0. Lower = faster detection, slightly less accurate.
                                  # Default 0.8 s gives good stop-command accuracy.
    min_rms_threshold: 0.015      # Energy gate: chunks below this RMS are discarded (speaker bleed).
                                  # Raise if Piper echo falsely triggers detection (~0.03–0.05).
                                  # Lower if your mic is very quiet and stop commands are missed (~0.005).

  # TTS Text Pre-Processing Filter
  # ---------------------------------
  # Applied ONLY to the text sent to the TTS engine.
  # The original response is never modified and is always shown in the UI/chat.
  # Removes markdown, code blocks, headers, and list markers so Spidy speaks
  # natural prose instead of reading raw markdown aloud.
  #
  # Impact (measured): A 480-char code response (spoken: ~46s) becomes a
  # 72-char acknowledgement (spoken: ~7s) — a 6x reduction in TTS duration.
  tts_filter:
    enabled: true                 # Master switch. Set false to disable all filtering (raw LLM text to TTS).
    code_block_replacement: "I've written the code. You can see it in the chat."
                                  # Spoken phrase that replaces each fenced code block (```...```).
                                  # Keep short (<= 10 words) for natural speech flow.
                                  # Set to "" to silently drop code blocks with no spoken replacement.
    url_replacement: "the link"   # Replacement for bare URLs (https://...).

# --------------------------------------------------------------------------- #
# Context Observer (Milestone 2)                                               #
# --------------------------------------------------------------------------- #
context:
  enabled: true                   # Master switch for the entire context layer

  snapshot_interval: 10.0         # Seconds between full desktop snapshots

  # Active Window (pywin32)
  window_poll_interval: 0.5       # How often to check the foreground window

  # Clipboard (permission-aware)
  clipboard_enabled: true         # Set false for privacy
  clipboard_poll_interval: 1.0

  # Process Monitor (psutil)
  process_monitor_enabled: true
  process_poll_interval: 3.0      # Seconds between process list snapshots

  # System Resources (psutil + torch.cuda)
  resource_monitor_enabled: true
  resource_poll_interval: 5.0     # Seconds between resource polls
  cpu_alert_threshold: 90.0       # % — alert when CPU exceeds this
  ram_alert_threshold: 85.0       # % — alert when RAM exceeds this
  battery_alert_threshold: 20.0   # % — alert when battery drops below this

  # Downloads Watcher (watchdog)
  download_monitor_enabled: true

  # Notifications (stub — planned for Milestone 5)
  notification_monitor_enabled: true

# --------------------------------------------------------------------------- #
# Reasoning Engine                                                            #
# --------------------------------------------------------------------------- #
reasoning:
  provider: "ollama"              # ollama | openai | groq
  model: "llama3.2:3b"           # Model to use with the provider
  base_url: "http://localhost:11434"  # Ollama local server URL
  api_key: null                   # Required only for cloud providers
  temperature: 0.7
  max_tokens: 1024
  timeout_seconds: 30
  system_prompt_path: "config/system_prompt.txt"

# --------------------------------------------------------------------------- #
# Multi-Provider LLM                                                          #
# --------------------------------------------------------------------------- #
# Spidy tries providers in order. If a provider fails (timeout, quota, HTTP  #
# error, network failure) it automatically falls back to the next one.       #
#                                                                             #
# Priority with NVIDIA_API_KEY present:                                       #
#   1. NVIDIA NIM  — primary for ALL LLM requests (chat, code, reasoning...) #
#   2. Ollama      — local fallback when NVIDIA is unavailable                #
#                                                                             #
# Without NVIDIA_API_KEY: only Ollama is used (existing behaviour unchanged). #
#                                                                             #
# SECURITY:                                                                   #
#   NEVER put your API key here. Leave api_key: "" and set the env var:       #
#   Windows:  $env:NVIDIA_API_KEY = "nvapi-..."                               #
#   .env file: NVIDIA_API_KEY=nvapi-...   (file is git-ignored)               #
# --------------------------------------------------------------------------- #
llm:
  auto_fallback: true             # Automatically try next provider on failure
  failure_threshold: 3            # Skip provider after N consecutive failures

  providers:
    # ── Primary: NVIDIA NIM ──────────────────────────────────────────────── #
    - name: nvidia
      enabled: true               # Set false to disable NVIDIA even with key
      model: "meta/llama-3.1-8b-instruct"  # Fast, capable NIM model
      base_url: "https://integrate.api.nvidia.com/v1"
      api_key: ""                 # LEAVE EMPTY — use NVIDIA_API_KEY env var
      temperature: 0.7
      max_tokens: 1024
      timeout_seconds: 60         # NIM cloud calls may be slower than Ollama

    # ── Fallback: Ollama (local) ─────────────────────────────────────────── #
    - name: ollama
      enabled: true
      model: "llama3.2:3b"
      base_url: "http://localhost:11434"
      temperature: 0.7
      max_tokens: 1024
      timeout_seconds: 30

# --------------------------------------------------------------------------- #
# Memory Engine                                                               #
# --------------------------------------------------------------------------- #
memory:
  enabled: true             # Master switch — set false to disable all memory

  # Per-tier enable flags
  enable_working: true      # In-process session buffer (no external deps)
  enable_episodic: true     # Persistent SQLite store (requires: pip install aiosqlite)
  enable_semantic: true     # Vector search (requires: pip install chromadb sentence-transformers)

  short_term:
    max_messages: 20              # Rolling window for conversation context

  long_term:
    db_filename: "spidy_memory.db"

  semantic:
    collection_name: "spidy_memories"
    embedding_model: "all-MiniLM-L6-v2"  # Lightweight, fast embeddings

# --------------------------------------------------------------------------- #
# UI / Overlay                                                                #
# --------------------------------------------------------------------------- #
ui:
  enabled: true
  theme: "dark"                   # dark | light
  opacity: 0.92                   # Window opacity (0.0–1.0)
  position: "top-right"           # top-right | top-left | center | bottom-right
  width: 420
  height: 600
  always_on_top: true
  animate: true
  hotkey: "ctrl+space"            # Backup wake hotkey

# --------------------------------------------------------------------------- #
# Permissions                                                                 #
# --------------------------------------------------------------------------- #
permissions:
  policy_file: "permissions/policies/default_policy.yaml"
  require_confirmation_for:
    - "delete_file"
    - "run_script"
    - "registry_edit"
    - "shutdown"
    - "install_software"
  audit_log_enabled: true
  audit_log_file: "spidy_audit.log"

# --------------------------------------------------------------------------- #
# Plugins                                                                     #
# --------------------------------------------------------------------------- #
plugins:
  enabled: true
  auto_discover: true
  sandbox: true                   # Run plugins in subprocess isolation

# --------------------------------------------------------------------------- #
# System Monitoring                                                           #
# --------------------------------------------------------------------------- #
system:
  poll_interval_seconds: 5        # How often to refresh system stats
  cpu_alert_threshold: 90         # Alert when CPU > N%
  ram_alert_threshold: 85         # Alert when RAM > N%
  battery_alert_threshold: 20     # Alert when battery < N%

# --------------------------------------------------------------------------- #
# Skills                                                       (Milestone 6)  #
# --------------------------------------------------------------------------- #
skills:
  # Built-in skills
  help_skill_enabled: true
  time_skill_enabled: true
  greet_skill_enabled: true
  note_skill_enabled: true
  timer_skill_enabled: true
  system_skill_enabled: true
  notes_file: "notes.jsonl"

  # Desktop & File Agent skills (Milestone 6)
  file_skill_enabled: true
  app_skill_enabled: true
  system_control_skill_enabled: true

  # File search behaviour
  desktop_file_search_max_results: 50   # Hard cap on search results
  desktop_file_search_root: "~"         # Default search root (home directory)

  # Browser Agent skill (Milestone 7)
  browser_skill_enabled: true
  browser_type: "chromium"              # chromium | firefox | webkit
  browser_headless: false               # false = user sees the browser (default)
  browser_download_dir: "~"             # default download destination (home dir)
  browser_connect_to_existing: true     # try CDP attach to running Chrome first
  browser_cdp_endpoint: "http://localhost:9222"
  browser_page_load_timeout_ms: 30000
  browser_navigation_timeout_ms: 10000
  browser_read_page_max_chars: 5000
  browser_history_limit: 20

# --------------------------------------------------------------------------- #
# Browser Agent                                              (Milestone 7)    #
# --------------------------------------------------------------------------- #
browser:
  browser_type: "chromium"              # chromium | firefox | webkit
  headless: false                       # false = visible window (recommended)
  download_dir: "~"                     # default download dir (home directory)
  connect_to_existing: true             # attach to running Chrome via CDP first
  cdp_endpoint: "http://localhost:9222" # Chrome --remote-debugging-port endpoint
  page_load_timeout_ms: 30000           # ms to wait for a page to load
  navigation_timeout_ms: 10000          # ms for back/forward/refresh
  read_page_max_chars: 5000             # max characters from read_page action
  history_limit: 20                     # max browser history entries


# --------------------------------------------------------------------------- #
# Vision Engine                                              (Milestone 9)    #
# --------------------------------------------------------------------------- #
vision:
  enabled: true                   # Master switch — set false to disable all vision

  # Per-engine enable flags
  # ScreenshotEngine: fast screen capture via mss
  #   Install: pip install mss
  enable_screenshot: true

  # OCREngine: on-screen text extraction via easyocr
  #   Install: pip install easyocr
  #   Note: first use downloads ~500 MB of models
  enable_ocr: true

  # ScreenAnalyzer: active app, window enumeration, UI region detection
  #   win32gui is already installed (M6); opencv is optional
  #   Install: pip install opencv-python
  enable_screen_analysis: true

  # ScreenshotEngine settings
  screenshot:
    default_monitor: 0            # 0 = primary monitor
    capture_format: "PNG"         # PNG is lossless (recommended)

  # OCREngine settings
  ocr:
    language: "en"                # ISO 639-1 language code
    confidence_threshold: 0.5     # Min confidence to include a text block
    gpu: false                    # Set true to use GPU (requires CUDA + easyocr[gpu])

# --------------------------------------------------------------------------- #
# Knowledge Engine                                           (Milestone 10)   #
# --------------------------------------------------------------------------- #
knowledge:
  enabled: true                   # Master switch — set false to disable all knowledge

  # Document chunking
  chunk_size: 1000                # Target characters per chunk
  chunk_overlap: 200              # Overlap between adjacent chunks (prevents context loss)

  # Embedding
  #   Uses sentence-transformers (same dep as M8 Memory Engine)
  #   Install: pip install sentence-transformers
  embedding_model: "all-MiniLM-L6-v2"  # 384-dim, lightweight and fast

  # Vector store
  #   Uses ChromaDB (same dep as M8 Memory Engine)
  #   Collection is separate from memory: "spidy_knowledge" vs "spidy_memories"
  #   Install: pip install chromadb
  collection_name: "spidy_knowledge"

  # Retrieval
  min_relevance_score: 0.3        # Minimum cosine similarity to include a chunk (0.0–1.0)
  max_results: 5                  # Default top-k chunks returned per query

  # Optional web search (disabled by default — privacy first)
  #   Install: pip install duckduckgo-search
  web_search:
    enabled: false                # Set true to allow web search augmentation
    provider: "duckduckgo"        # duckduckgo (no API key required)
    max_results: 5                # Max web results to augment per query
    safe_search: true             # Apply safe-search filtering

# --------------------------------------------------------------------------- #
# Learning Engine (Milestone 11)                                              #
# --------------------------------------------------------------------------- #
# Spidy learns about you from your interaction patterns.
# No LLM fine-tuning. No telemetry. No cloud. All local.
learning:
  enabled: true                   # Set false to disable all learning

  # Persistence
  #   The learning DB is stored alongside the memory DB.
  db_filename: "spidy_learning.db"

  # Habit detection
  #   A habit is promoted when observed at least min_observations_for_habit times.
  min_observations_for_habit: 3
  habit_window_days: 30           # Only count observations within this window

  # Workflow detection
  #   A workflow is stored after min_observations_for_workflow repeated sequences.
  min_observations_for_workflow: 3
  max_workflow_steps: 10          # Maximum steps per tracked sequence

  # Feedback confidence adjustment
  #   Positive feedback boosts preference confidence by feedback_boost.
  #   Negative feedback decays preference confidence by feedback_decay.
  feedback_boost: 0.15
  feedback_decay: 0.10

  # Privacy / data retention
  #   Feedback signals older than data_retention_days are pruned automatically.
  data_retention_days: 365
