name: Spidy CI

on:
  push:
    branches: [ "develop", "main", "milestone/**", "feat/**", "hotfix/**" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check spidy/ tests/

      - name: Ruff format check
        run: ruff format --check spidy/ tests/

      - name: Mypy type check
        run: mypy spidy/ --ignore-missing-imports
        continue-on-error: true  # Type check advisory during early development

  test:
    name: Unit Tests
    runs-on: windows-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Install package in editable mode
        run: pip install -e .

      - name: Run unit tests with coverage
        run: pytest tests/unit/ -v --cov=spidy --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
        continue-on-error: true
